[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronodb-engine"
version = "0.1.0"
description = "ChronoDB Version Engine MVP"
authors = [{ name = "ChronoDB Team" }]
dependencies = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = [
    "engine/tests",
]
pythonpath = [
    "engine",
    "engine/src"
]
